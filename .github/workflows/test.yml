name: BRS Smart Contract Tests

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

env:
  NODE_VERSION: '22.x'
  FOUNDRY_PROFILE: ci

jobs:
  # ============ Hardhat Tests ============
  hardhat-test:
    name: Hardhat Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run Hardhat tests
        run: npx hardhat test
        env:
          REPORT_GAS: false

  # ============ Forge Tests ============
  forge-test:
    name: Forge Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run Forge build
        run: forge build

      - name: Run Unit Tests
        run: forge test --match-path "forge-test/unit/*.sol" --no-match-test "testPCEDeviationLimit" -vvv

      - name: Run Integration Tests
        run: forge test --match-path "forge-test/integration/*.sol" -vvv

  # ============ Fuzz Tests ============
  fuzz-test:
    name: Fuzz Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run Forge build
        run: forge build

      - name: Run Fuzz Tests
        run: forge test --match-path "forge-test/fuzz/*.sol" --fuzz-runs 512 -vvv

  # ============ Invariant Tests ============
  invariant-test:
    name: Invariant Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run Forge build
        run: forge build

      - name: Run Invariant Tests
        run: forge test --match-path "forge-test/invariant/*.sol" -vvv

  # ============ Code Quality ============
  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Solidity linter
        run: npx solhint 'contracts/**/*.sol'

      - name: Run JavaScript/TypeScript linter
        run: npx eslint 'test/**/*.ts' 'scripts/**/*.{js,mjs,ts}'

  # ============ Security Analysis ============
  security:
    name: Security Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run Slither
        uses: crytic/slither-action@v0.3.0
        with:
          target: 'contracts/'
          slither-args: >-
            --exclude-dependencies
            --filter-paths 'contracts/local|contracts/test'
            --exclude-informational
            --exclude-low
            --exclude-optimization
            --exclude divide-before-multiply,incorrect-equality,reentrancy-no-eth

  # ============ Gas Report ============
  gas-report:
    name: Gas Usage Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run gas reporter
        run: |
          REPORT_GAS=true npx hardhat test 2>&1 | tee gas-report.txt
          exit ${PIPESTATUS[0]}

      - name: Upload gas report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gas-report
          path: gas-report.txt
          retention-days: 30

  # ============ Coverage Report ============
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run Forge coverage and enforce branch baseline
        run: MIN_BRANCH_COVERAGE=33 npm run coverage:branches

  # ============ Formal Verification Core ============
  formal-core:
    name: Formal Verification Core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install Halmos
        run: python3 -m pip install --user halmos

      - name: Run strict formal core properties
        run: npm run formal:core
